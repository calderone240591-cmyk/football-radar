<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1210">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Футбол Радар">
  <meta name="description" content="Сухі матчі, тотали, картки й кутові: рекомендації з кф VBET і статистика">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Футбол Радар</title>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Футбол Радар</h1>
    <span id="upd" class="upd"></span>
    <button id="refresh" class="icon-btn" aria-label="Оновити">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="dry">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8"/></svg>
      <span>Сухі</span>
    </a>
    <a href="#/tot" data-tab="tot">
      <svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>
      <span>Тотали</span>
    </a>
    <a href="#/card" data-tab="card">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="10" height="14" rx="1.5"/><path d="M19 7v14H9"/></svg>
      <span>Картки й кутові</span>
    </a>
    <a href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      <span>Статистика</span>
    </a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vbet.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      // Оновлення приходять одразу: новий service worker перезавантажує сторінку сам.
      const had = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
      navigator.serviceWorker.register('sw.js').then(r => {
        r.update();
        setInterval(() => r.update().catch(() => {}), 5 * 60 * 1000);
      }).catch(() => {});
    }
  </script>
</body>
</html>
